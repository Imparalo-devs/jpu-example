name: VueCode Debug Session
on:
  workflow_dispatch:
    inputs:
      session_token:
        description: 'Debug session token'
        required: true
        type: string
      session_id:
        description: 'Debug session ID'
        required: true
        type: string

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install pyyaml -q 2>/dev/null || true

      - name: Run VueCode debug agent
        env:
          SESSION_TOKEN: ${{ inputs.session_token }}
          SESSION_ID: ${{ inputs.session_id }}
          STREAM_URL: https://vnklfhqnrbzhiiqoiwxz.supabase.co/functions/v1/vibe-debug-stream
          AGENT_B64: 
        run: |
          echo "$AGENT_B64" | base64 -d > /tmp/vuecode_agent.py
          python3 /tmp/vuecode_agent.py
