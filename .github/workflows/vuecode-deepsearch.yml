name: VueCode DeepSearch
on:
  workflow_dispatch:
    inputs:
      session_token:
        required: true
        type: string
      session_id:
        required: true
        type: string
      user_query:
        required: false
        type: string

jobs:
  deepsearch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run VueCode DeepSearch
        env:
          SESSION_TOKEN: ${{ inputs.session_token }}
          SESSION_ID: ${{ inputs.session_id }}
          USER_QUERY: ${{ inputs.user_query }}
          STREAM_URL: https://vnklfhqnrbzhiiqoiwxz.supabase.co/functions/v1/vibe-debug-stream
          AGENT_B64: 
        run: |
          echo "$AGENT_B64" | base64 -d > /tmp/vuecode_deepsearch.py
          python3 /tmp/vuecode_deepsearch.py
